id: qoder
schema_version: 1
display_name: Qoder
description: Controls Qoder Desktop through its local Chromium DevTools Protocol connection.
icon_url: https://registry.npmmirror.com/@lobehub/icons-static-avatar/latest/files/avatars/qoder.webp
icon_svg_url: https://registry.npmmirror.com/@lobehub/icons-static-svg/latest/files/icons/qoder.svg
version: 0.1.9
plugin_protocol_version: "4"
min_hub_version: 0.1.0
integration_mode: desktop-automation
runtime_integration:
  desktop: desktop-automation
transport: process
runtime_modes: [desktop]
default_runtime_mode: desktop
runtime_controls:
  desktop:
    model: stable
    reasoning: stable
    permission: stable
runtime_operations:
  desktop:
    rename: unsupported
    pin: unsupported
    archive: unsupported
    delete: unsupported
managed_launch: true
managed_launch_specs:
  - kind: service
    start: ["node", "scripts/launch-qoder.mjs"]
    ready: probe
    ready_timeout_ms: 60000
    runtime_modes: [desktop]
runtime_dependencies:
  node: ">=22.0.0 <23.0.0"
command: ["${runtime.node}", "--max-old-space-size=320", "index.js"]
capabilities:
  native_visible_input: true
  native_visible_output: true
  can_attach_session: true
  can_start_session_with_message: true
  can_open_draft: true
  can_list_sessions: true
  can_read_history: true
  can_interrupt: true
  can_approval: true
  can_forward_sync: true
  can_reverse_sync: true
  can_plugin_wide_watch: false
  can_wait_run: true
  can_read_status: true
  can_control_session: true
